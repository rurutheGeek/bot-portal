name: CI
on:
  # PRでは pull_request だけで走らせ、push との二重実行を避ける。
  push:
    branches: [main]
  pull_request:
# 同じrefの古い実行は新しい実行で置き換える。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python3 -m pip install ruff==0.16.10
          python3 -m pip install -r requirements.txt
      # 整形ではなく壊れたコード・明確なバグだけを見る。
      - name: Lint Python
        run: python3 -m ruff check --select E9,F .
      - name: Compile Python
        run: python3 -m compileall -q app tests
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
      - name: Build the image
        run: docker build -t bot-portal:ci .
